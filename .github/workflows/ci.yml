name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MaybeComingBot.slnx

      - name: Build
        run: dotnet build MaybeComingBot.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test MaybeComingBot.slnx --no-build --configuration Release --verbosity normal